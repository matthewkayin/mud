# Deploys a release: commits its version to backend/VERSION and force-pushes it to the prod branch, which Disco deploys.
name: Deploy

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check release version
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$VERSION' must be MAJOR.MINOR.PATCH, e.g. 1.4.0"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Commit version and push to prod
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          echo "$VERSION" > backend/VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/VERSION
          git commit -m "Release $VERSION"
          git push --force origin HEAD:refs/heads/prod
